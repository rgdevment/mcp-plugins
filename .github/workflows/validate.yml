name: Validate

on:
  pull_request:
  push:
    branches: [main]
  # The LobeHub workflow's pull requests start no run of their own, so it asks for this one.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAUDE_CODE: "2.1.308"
  GEMINI_CLI: "0.65.0"
  MARKDOWNLINT: "0.24.0"

jobs:
  plugins:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Claude Code marketplace
        run: npx -y "@anthropic-ai/claude-code@$CLAUDE_CODE" plugin validate .
      # The directory profile fails on what Anthropic's directory would refuse a submission for.
      - name: Each plugin as the Claude directory reads it
        run: |
          for plugin in plugins/*/; do
            npx -y "@anthropic-ai/claude-code@$CLAUDE_CODE" plugin validate "$plugin" --profile directory
          done
      - name: Cursor marketplace
        run: node scripts/cursor.mjs
      # Claude Code pins people to a plugin's version, so a change that forgets to raise it never reaches them.
      - name: One version for a plugin and its npm launcher
        run: |
          for plugin in plugins/*/; do
            [ -f "$plugin/package.json" ] || continue
            versions=$(for f in package.json .claude-plugin/plugin.json .cursor-plugin/plugin.json; do
              node -p "require('./$plugin$f').version"
            done | sort -u)
            if [ "$(echo "$versions" | wc -l)" -ne 1 ]; then
              echo "::error::$plugin has different versions: $(echo $versions)"; exit 1
            fi
          done
      # Gemini CLI takes the whole repository as one extension, the Tisty plugin.
      - name: Gemini CLI extension
        run: |
          npx -y "@google/gemini-cli@$GEMINI_CLI" extensions validate .
          node -e '
            const g = require("./gemini-extension.json");
            const p = require("./plugins/tisty/package.json");
            const fs = require("node:fs");
            const fail = (why) => { console.error(`::error::gemini-extension.json: ${why}`); process.exit(1); };
            if (g.version !== p.version) fail(`version ${g.version}, the plugin is ${p.version}`);
            if (!fs.existsSync(g.contextFileName)) fail(`contextFileName ${g.contextFileName} is not there`);
            for (const [name, server] of Object.entries(g.mcpServers)) {
              const file = server.args[0].replace("${extensionPath}${/}", "").split("${/}").join("/");
              if (!fs.existsSync(file)) fail(`server ${name} runs ${file}, which is not there`);
            }
          '

  markdown:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npx -y "markdownlint-cli2@$MARKDOWNLINT"

  launcher:
    name: launcher / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        node: [24]
        include:
          # The oldest Node the npm package promises in its engines.
          - os: ubuntu-24.04
            node: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # Node 18 takes no glob of its own, so bash expands it on every system.
      - run: node --test test/*.test.mjs
        shell: bash
