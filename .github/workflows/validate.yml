name: Validate

on:
  pull_request:
  push:
    branches: [main]
  # The LobeHub workflow's pull requests start no run of their own, so it asks for this one.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAUDE_CODE: "2.1.308"
  MARKDOWNLINT: "0.24.0"

jobs:
  plugins:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Claude Code marketplace
        run: npx -y "@anthropic-ai/claude-code@$CLAUDE_CODE" plugin validate .
      # The directory profile fails on what Anthropic's directory would refuse a submission for.
      - name: Each plugin as the Claude directory reads it
        run: |
          for plugin in plugins/*/; do
            npx -y "@anthropic-ai/claude-code@$CLAUDE_CODE" plugin validate "$plugin" --profile directory
          done
      - name: Cursor marketplace
        run: node scripts/cursor.mjs

  markdown:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npx -y "markdownlint-cli2@$MARKDOWNLINT"

  launcher:
    name: launcher / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        node: [24]
        include:
          # The oldest Node the npm package promises in its engines.
          - os: ubuntu-24.04
            node: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test/
