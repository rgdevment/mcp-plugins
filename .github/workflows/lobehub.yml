name: LobeHub listing

on:
  schedule:
    - cron: "23 10 * * *"
  push:
    branches: [main]
    paths: ["listings/lobehub/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lobehub-listing

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      actions: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      LISTING: listings/lobehub/tisty/lhm.plugin.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # `gh release view` with no tag answers with the latest release, which is never a pre-release.
      - name: Is there a Tisty release LobeHub has not been given
        id: look
        run: |
          version=$(gh release view -R rgdevment/Tisty --json tagName -q .tagName)
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tisty's latest release is «$version», not a version"; exit 1
          fi
          listed=$(node -p "require('./$LISTING').version")
          branch="chore/lobehub-$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          # A pull request closed without merging is an answer too, so it is not opened again.
          asked=$(gh pr list --repo "$REPO" --head "$branch" --state all --json number -q length)
          if [ "$version" = "$listed" ]; then
            echo "LobeHub's manifest already lists Tisty $version"
          elif [ "$asked" != "0" ]; then
            echo "$branch already has a pull request"
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the server of that release
        id: build
        if: steps.look.outputs.due == 'true'
        env:
          VERSION: ${{ steps.look.outputs.version }}
        run: |
          built=$(scripts/build-tisty.sh "$VERSION")
          echo "tisty=$built" >> "$GITHUB_OUTPUT"

      - name: Regenerate the manifest from its tools
        if: steps.look.outputs.due == 'true'
        env:
          VERSION: ${{ steps.look.outputs.version }}
          TISTY: ${{ steps.build.outputs.tisty }}
        run: node scripts/lobehub.mjs "$VERSION" "$TISTY"

      # Written through the contents API so GitHub signs the commit, as the branch rules ask.
      - name: Open the pull request
        if: steps.look.outputs.due == 'true'
        env:
          VERSION: ${{ steps.look.outputs.version }}
          BRANCH: ${{ steps.look.outputs.branch }}
        run: |
          title="chore(listings): LobeHub lists Tisty $VERSION"
          base=$(gh api "repos/$REPO/git/ref/heads/main" -q .object.sha)
          # A branch left by a run that failed before its pull request is started over.
          gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$base" --silent 2>/dev/null \
            || gh api -X PATCH "repos/$REPO/git/refs/heads/$BRANCH" -f sha="$base" -F force=true --silent
          sha=$(gh api "repos/$REPO/contents/$LISTING?ref=$BRANCH" -q .sha)
          node -e '
            const fs = require("node:fs");
            const [file, message, branch, sha] = process.argv.slice(1);
            const content = fs.readFileSync(file).toString("base64");
            fs.writeFileSync("put.json", JSON.stringify({ message, branch, sha, content }));
          ' "$LISTING" "$title" "$BRANCH" "$sha"
          gh api -X PUT "repos/$REPO/contents/$LISTING" --input put.json --silent
          gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "$title" --body "The LobeHub manifest regenerated from Tisty $VERSION's server. Once merged, the workflow publishes it with the LobeHub session stored for it; when it cannot, an issue asks for \`scripts/release.sh $VERSION\`."
          # A pull request opened with this token starts no workflow of its own, so the required checks are asked for.
          gh workflow run validate.yml --repo "$REPO" --ref "$BRANCH"

  # LobeHub publishes only for a signed-in person, so the session the owner stored does it; without one, the issue below asks as before.
  publish:
    if: github.event_name != 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      LISTING: listings/lobehub/tisty/lhm.plugin.json
      PAGE: https://market.lobehub.com/s/plugins/rgdevment-tisty
      SESSION_FILE: .lobehub-market/user-credentials.json
    outputs:
      done: ${{ steps.publish.outcome == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Does LobeHub lag behind main
        id: look
        run: |
          listed=$(node -p "require('./$LISTING').version")
          published=$(scripts/lobehub-shows.sh "$PAGE")
          echo "listed=$listed" >> "$GITHUB_OUTPUT"
          if [ -z "$published" ]; then
            echo "LobeHub's page gave no version to compare, so nothing is published"
          elif [ "$published" = "$listed" ]; then
            echo "LobeHub carries Tisty $listed"
          else
            echo "LobeHub shows $published and main lists $listed"
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bring the stored LobeHub session
        id: session
        env:
          SESSION: ${{ secrets.LOBEHUB_USER_CREDENTIALS }}
        run: |
          if [ -z "$SESSION" ]; then
            echo "::notice::No LobeHub session is stored, so the publish stays with the person"
            exit 0
          fi
          umask 077
          mkdir -p "$(dirname "$HOME/$SESSION_FILE")"
          printf '%s' "$SESSION" > "$HOME/$SESSION_FILE"
          if ! node -e 'const held = require(process.argv[1]); process.exit(held.accessToken && held.refreshToken ? 0 : 1)' "$HOME/$SESSION_FILE" 2>/dev/null; then
            echo "::error::The stored LobeHub session is not the file LobeHub's sign-in writes. Store it again from a computer signed in to LobeHub."
            exit 1
          fi
          echo "stored=true" >> "$GITHUB_OUTPUT"

      - name: Publish the listing main carries
        id: publish
        if: steps.look.outputs.due == 'true' && steps.session.outputs.stored == 'true'
        env:
          LISTED: ${{ steps.look.outputs.listed }}
        run: |
          prints() {
            node -p 'const held = require(process.argv[1]); const print = (token) => require("node:crypto").createHash("sha256").update(String(token)).digest("hex"); `${print(held.accessToken)} ${print(held.refreshToken)}`' "$HOME/$SESSION_FILE"
          }
          read -r access renewal < <(prints)
          scripts/release.sh "$LISTED"
          read -r access_now renewal_now < <(prints)
          if [ "$access" = "$access_now" ]; then
            echo "LobeHub did not renew the session in this run, so it does not tell whether a renewal replaces it"
          elif [ "$renewal" = "$renewal_now" ]; then
            echo "::notice::LobeHub renewed the session and kept its renewal token, so the stored session stays good"
          else
            echo "::warning::LobeHub gave the session a new renewal token. Store the session again; your own computer may have to sign in again too."
          fi

  # Without a stored session, or when it fails, an issue keeps asking until LobeHub carries what main lists.
  remind:
    needs: publish
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      LISTING: listings/lobehub/tisty/lhm.plugin.json
      PAGE: https://market.lobehub.com/s/plugins/rgdevment-tisty
      TITLE: LobeHub awaits Tisty
      PUBLISHED_NOW: ${{ needs.publish.outputs.done }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ask for the publish while LobeHub lags behind main
        run: |
          listed=$(node -p "require('./$LISTING').version")
          published=$(scripts/lobehub-shows.sh "$PAGE")
          if [ -z "$published" ]; then
            echo "::warning::LobeHub's page gave no version to compare"; exit 0
          fi
          open=$(gh issue list --repo "$REPO" --state open --json number,title -q "map(select(.title | startswith(\"$TITLE \"))) | .[0].number // empty")
          if [ "$published" = "$listed" ]; then
            echo "LobeHub carries Tisty $listed"
            if [ -n "$open" ]; then
              gh issue close "$open" --repo "$REPO" --comment "LobeHub carries Tisty $listed now."
            fi
            exit 0
          fi
          if [ "$PUBLISHED_NOW" = "true" ]; then
            echo "This run published Tisty $listed and LobeHub's page still shows $published; the next run looks again"
            exit 0
          fi
          title="$TITLE $listed"
          body=$(printf '%s\n' \
            "main lists Tisty $listed for LobeHub, and LobeHub shows $published: $PAGE" \
            "" \
            "The workflow publishes it by itself only while a LobeHub session is stored for it and still good. Publish it signed in to LobeHub, from Git Bash in a clone of this repository:" \
            "" \
            '```sh' \
            "npx -y @lobehub/market-cli@0.0.43 login" \
            "scripts/release.sh $listed" \
            '```' \
            "" \
            "To hand the next ones to the workflow, store that sign-in afterwards:" \
            "" \
            '```sh' \
            "gh secret set LOBEHUB_USER_CREDENTIALS -R $REPO < ~/.lobehub-market/user-credentials.json" \
            '```' \
            "" \
            "This issue closes by itself once LobeHub shows $listed.")
          if [ -n "$open" ]; then
            gh issue edit "$open" --repo "$REPO" --title "$title" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body" --assignee "$GITHUB_REPOSITORY_OWNER"
          fi
