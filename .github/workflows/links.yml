name: Links

on:
  pull_request:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Store answers bots with an error page, and a 429 only asks to slow down: neither is a broken link.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-retries 3 --retry-wait-time 5
            --exclude apps.microsoft.com --accept '200..=299,429'
            './**/*.md' './plugins/**/*.json' './.claude-plugin/*.json' './.cursor-plugin/*.json'
          fail: true
