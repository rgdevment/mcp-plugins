name: Compatibility

on:
  pull_request:
    paths:
      - "plugins/**"
      - "scripts/compat.mjs"
      - "scripts/build-tisty.sh"
      - ".github/workflows/compat.yml"
  schedule:
    - cron: "41 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-tisty:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the server of Tisty's latest release
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh release view -R rgdevment/Tisty --json tagName -q .tagName)
          built=$(scripts/build-tisty.sh "${version#v}")
          echo "tisty=$built" >> "$GITHUB_OUTPUT"
      - name: The tools the plugin's docs name are there
        env:
          TISTY: ${{ steps.build.outputs.tisty }}
        run: node scripts/compat.mjs "$TISTY"
